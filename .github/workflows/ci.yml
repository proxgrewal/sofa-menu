name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        # next lint prompts interactively when no ESLint config exists, which
        # fails in CI. Run it only once a config is committed; typecheck + build
        # provide the hard gate until then.
        run: |
          if [ -f .eslintrc.json ] || [ -f .eslintrc.js ] || [ -f eslint.config.mjs ] || [ -f eslint.config.js ]; then
            npm run lint
          else
            echo "No ESLint config present — skipping lint."
          fi
      - name: Build
        run: npm run build
